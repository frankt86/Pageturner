site_name: Pageturner
site_description: "Pageturner is an open source audiobook player and ebook reader, based on Voice."
site_author: frankt86
site_url: https://frankt86.github.io/Pageturner/

repo_url: https://github.com/frankt86/Pageturner
repo_name: "Pageturner on GitHub"

nav:
  - Home: index.md
  - Install: install.md
  - Organizing Audiobooks: organizing.md
  - Ebooks: ebooks.md
  - Audiobookshelf: audiobookshelf.md
  - FAQ: faq.md
  - Development: development.md
  - Architecture: architecture.md
  - Privacy Policy: privacy-policy.md
  - License: license.md

theme:
  name: material
  logo: logo.png
  favicon: logo.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search

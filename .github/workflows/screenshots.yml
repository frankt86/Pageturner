name: Screenshots

# Renders the screenshot previews of the library, player and reader into docs/images and commits them.
on:
  workflow_dispatch:
  push:
    branches: [ screenshots ]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Render
        run: ./gradlew :features:bookOverview:snapshot :features:playbackScreen:snapshot :features:reader:snapshot
      - name: Commit
        run: |
          mkdir -p docs/images
          find features -path "*/build/snapshots/*" -name "*Screenshot*.png" ! -name "*_dark.png" ! -name "*_landscape.png" ! -name "*_tablet.png" -exec cp {} docs/images/ \;
          ls -la docs/images
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          git diff --cached --quiet || git commit -m "Render the screenshots"
          git push

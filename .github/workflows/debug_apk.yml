name: Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-apk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      # a shrunk release build, small enough to download on a phone, with the debug app id and key
      - name: Build
        run: |
          ./gradlew :app:assembleFreeRelease \
            -Pvoice.applicationIdSuffix=.debug \
            -Pandroid.injected.signing.store.file="$PWD/app/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
      - name: Publish to the debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/free/release/app-free-release.apk app-free-debug.apk
          notes="Latest debug build of main (${GITHUB_SHA::7}). Installs next to the store version of Voice."
          # replaces the file in place, so the download link never goes missing while a new build is published
          if gh release view debug > /dev/null 2>&1; then
            gh release upload debug app-free-debug.apk --clobber
            gh release edit debug --notes "$notes"
          else
            gh release create debug app-free-debug.apk --prerelease --target "$GITHUB_SHA" --title "Debug build" --notes "$notes"
          fi

name: Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-apk
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Build
        run: ./gradlew :app:assembleFreeDebug
      - name: Publish to the debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/free/debug/*.apk app-free-debug.apk
          gh release delete debug --yes --cleanup-tag || true
          gh release create debug app-free-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug build" \
            --notes "Latest debug build of main (${GITHUB_SHA::7}). Installs next to the store version of Voice."

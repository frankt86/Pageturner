name: Neural voice probe

on:
  push:
    branches: [ neural-voice-probe ]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APK
        run: ./gradlew :features:reader:assembleDebugAndroidTest
      - name: Probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -memory 6144
          script: |
            adb logcat -c
            adb logcat -v time > logcat.txt &
            ./gradlew :features:reader:connectedDebugAndroidTest || true
            sleep 2
            grep -E "NeuralVoiceProbe|sherpa|onnx|AudioTrack|AndroidRuntime|Pageturner|Could not|linker|nativebridge|TestRunner" logcat.txt | tail -400
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe
          path: |
            logcat.txt
            features/reader/build/outputs/androidTest-results/**

name: Neural voice probe

on:
  push:
    branches: [ neural-voice-probe ]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APK
        run: |
          ./gradlew :features:reader:assembleDebugAndroidTest
          ./gradlew --stop
          find features/reader/build/outputs -name "*.apk"
      - name: Probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -memory 3072 -cores 2
          script: |
            adb logcat -c
            adb logcat -v time > logcat.txt &
            adb shell getprop ro.product.cpu.abilist; adb shell getprop ro.dalvik.vm.native.bridge
            adb install -r -t $(find features/reader/build/outputs -name "*androidTest*.apk" | head -1)
            adb shell pm list instrumentation
            timeout 50m adb shell am instrument -w -r -e class voice.features.reader.NeuralVoiceProbeTest voice.features.reader.test/androidx.test.runner.AndroidJUnitRunner || true
            sleep 2
            grep -n "NeuralVoiceProbe" logcat.txt
            awk '/downloaded=/{f=1} f' logcat.txt | grep -vE "Conscrypt|YouTube|GoogleApiManager|chatty" | head -400
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe
          path: |
            logcat.txt
            features/reader/build/outputs/androidTest-results/**

name: Build and Deploy Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - mkdocs.yml
      - CONTRIBUTING.md
      - LICENSE.md
      - Pipfile
  # puts each new APK on the site, a plain file that downloads on phones without GitHub's redirects
  workflow_run:
    workflows: [ "Debug APK", "Release" ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to GitHub Pages'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install pipenv
      - run: pipenv install
      - run: pipenv run mkdocs build --strict
      - name: Add the APKs
        env:
          RELEASES: https://github.com/${{ github.repository }}/releases
        run: |
          curl --fail --location --output site/pageturner-debug.apk "$RELEASES/download/debug/app-free-debug.apk"
          # the debug build stands in until there is a stable release
          if ! curl --fail --location --output site/pageturner.apk "$RELEASES/latest/download/pageturner.apk"; then
            echo "No stable release yet, so pageturner.apk is the debug build."
            cp site/pageturner-debug.apk site/pageturner.apk
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    if: github.event_name == 'push' || inputs.deploy != 'false'
    runs-on: ubuntu-latest
    needs: build
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

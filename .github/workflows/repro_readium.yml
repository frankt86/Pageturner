name: Repro Readium

on:
  pull_request:
    branches: [ main ]

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [ release, debug ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
        if: matrix.variant != 'test63'
      - uses: ./.github/actions/generate_baseline_profile
        if: matrix.variant == 'release'
        timeout-minutes: 30
        with:
          task: :app:generateFreeReleaseBaselineProfile -Pvoice.applicationIdSuffix=.debug
      - name: Get the APK
        run: |
          mkdir -p out
          case "${{ matrix.variant }}" in
            test63)
              curl -fsSL -o app.apk https://github.com/frankt86/Pageturner/releases/download/test-63/pageturner-test-63.apk ;;
            release)
              ./gradlew :app:assembleFreeRelease \
                -Pvoice.versionName=repro \
                -Pvoice.versionCode=2147483647 \
                -Pvoice.applicationIdSuffix=.debug \
                -Pandroid.injected.signing.store.file="$PWD/app/debug.keystore" \
                -Pandroid.injected.signing.store.password=android \
                -Pandroid.injected.signing.key.alias=androiddebugkey \
                -Pandroid.injected.signing.key.password=android
              cp app/build/outputs/apk/free/release/app-free-release.apk app.apk
              cp -r app/build/outputs/mapping out/ || true ;;
            debug)
              ./gradlew :app:assembleFreeDebug
              cp app/build/outputs/apk/free/debug/*.apk app.apk ;;
          esac
      - name: Get an EPUB
        run: |
          curl -fsSL -o book.epub https://www.gutenberg.org/ebooks/11.epub3.images \
            && unzip -l book.epub > /dev/null || python3 .github/repro/make_epub.py book.epub
          ls -la book.epub
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/repro/run.sh app.apk out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repro-${{ matrix.variant }}
          path: out

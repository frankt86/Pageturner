name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Ensure release runs from default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "Release must be dispatched from the default branch (${{ github.event.repository.default_branch }}); got ${GITHUB_REF_NAME}." >&2
          exit 1

      - name: Check signing secrets
        env:
          GH_SIGNING_KEYSTORE: ${{ secrets.GH_SIGNING_KEYSTORE }}
          GH_SIGNING_STORE_PASSWORD: ${{ secrets.GH_SIGNING_STORE_PASSWORD }}
          GH_SIGNING_KEY_PASSWORD: ${{ secrets.GH_SIGNING_KEY_PASSWORD }}
          GH_SIGNING_KEY_ALIAS: ${{ secrets.GH_SIGNING_KEY_ALIAS }}
        run: |
          missing=()
          for name in GH_SIGNING_KEYSTORE GH_SIGNING_STORE_PASSWORD GH_SIGNING_KEY_PASSWORD GH_SIGNING_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::The release signing secrets are missing: ${missing[*]}. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/determine_release_tag.main.kts --test
          ./scripts/determine_release_tag.main.kts

      - name: Read release notes from CHANGELOG.md
        env:
          VERSION_NAME: ${{ steps.tag.outputs.version_name }}
        run: ./scripts/changelog_section.sh "$VERSION_NAME" > "$RUNNER_TEMP/release_notes.md"

      - uses: ./.github/actions/build_setup

      - name: Setup Signing
        env:
          GITHUB_SIGNING_KEYSTORE: ${{ secrets.GH_SIGNING_KEYSTORE }}
        run: ./scripts/ci_signing_setup.sh free

      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.tag.outputs.version_name }}
          VERSION_CODE: ${{ steps.tag.outputs.version_code }}
          GITHUB_SIGNING_STORE_PASSWORD: ${{ secrets.GH_SIGNING_STORE_PASSWORD }}
          GITHUB_SIGNING_KEY_ALIAS: ${{ secrets.GH_SIGNING_KEY_ALIAS }}
          GITHUB_SIGNING_KEY_PASSWORD: ${{ secrets.GH_SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleFreeRelease \
            -Pvoice.applicationId=io.github.frankt86.pageturner \
            -Pvoice.versionName="$VERSION_NAME" \
            -Pvoice.versionCode="$VERSION_CODE" \
            -Pandroid.injected.signing.store.file="$PWD/signing/free/signing.keystore" \
            -Pandroid.injected.signing.store.password="$GITHUB_SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$GITHUB_SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$GITHUB_SIGNING_KEY_PASSWORD"
          mkdir -p artifacts
          cp app/build/outputs/apk/free/release/app-free-release.apk "artifacts/pageturner-$VERSION_NAME.apk"
          cp app/build/outputs/apk/free/release/app-free-release.apk artifacts/pageturner.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION_NAME: ${{ steps.tag.outputs.version_name }}
        run: |
          gh release create "$TAG" \
            artifacts/*.apk \
            --title "Pageturner $VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            --latest \
            --target "$GITHUB_SHA"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-${{ steps.tag.outputs.tag }}
          path: artifacts/
          if-no-files-found: ignore
